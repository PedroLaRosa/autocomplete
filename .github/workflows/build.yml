name: Build and publish specs

on:
  push:
    paths:
      - "src/**/*.ts"
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ponytail: version = 1.0.<run number>; bump the 1.0 in package.json for breaking changes
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - uses: JS-DevTools/npm-publish@v3
        with:
          access: public
          token: ${{ secrets.NPM_TOKEN }}
