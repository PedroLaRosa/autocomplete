name: Build and publish specs

on:
  push:
    paths:
      - "src/**/*.ts"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # no id-token: with it npm tries OIDC (403) instead of NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ponytail: version = 1.0.<run number>; bump the 1.0 in package.json for breaking changes
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
