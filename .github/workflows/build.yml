name: Build and publish specs

on:
  push:
    paths:
      - "src/**/*.ts"
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish directly to npm (skips staging and its 2FA approval)
        type: boolean
        default: false

permissions:
  id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ponytail: version = 1.0.<run number>; bump the 1.0 in package.json for breaking changes
      - run: npm pkg set version=1.0.${{ github.run_number }}
      # push / unchecked: stages the version; approve it with `npm stage approve <id>` (needs 2FA)
      # manual run with "publish" checked: publishes directly; needs "Allow npm publish" on the npm trusted publisher
      - run: npm ${{ inputs.publish && 'publish' || 'stage publish' }}
